name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-ios, aarch64-linux-android, aarch64-unknown-linux-musl

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Build release (macOS x86_64)
        if: matrix.os == 'macos-latest'
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build release (iOS aarch64)
        if: matrix.os == 'macos-latest'
        run: cargo build --release --target aarch64-apple-ios

      - name: Build release (Android aarch64)
        if: matrix.os == 'ubuntu-latest'
        run: >
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          cargo build --release --target aarch64-linux-android

      - name: Build release (Linux aarch64, static musl)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: cargo build --release --target aarch64-unknown-linux-musl

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: rust-lab-${{ matrix.os }}
          path: |
            target/release/rust-lab
            target/release/rust-lab.exe

      - name: Upload binary (macOS x86_64)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: rust-lab-macos-x86_64
          path: target/x86_64-apple-darwin/release/rust-lab

      - name: Upload binary (iOS aarch64)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: rust-lab-ios-aarch64
          path: target/aarch64-apple-ios/release/rust-lab

      - name: Upload binary (Android aarch64)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: rust-lab-android-aarch64
          path: target/aarch64-linux-android/release/rust-lab

      - name: Upload binary (Linux aarch64, static musl)
        if: matrix.os == 'ubuntu-24.04-arm'
        uses: actions/upload-artifact@v4
        with:
          name: rust-lab-linux-aarch64-musl
          path: target/aarch64-unknown-linux-musl/release/rust-lab
